; platformio.ini - chant-clicker
;
; The Makefiles still work and remain the reference build; this is the same
; three firmwares through PlatformIO, for editor integration and one-click
; build/upload. Both build systems compile the same sources out of src/, so
; nothing here is a fork - but if you add a .c file, add it to BOTH this file's
; build_src_filter and the matching Makefile.
;
;   pio run -e player -t upload            the player
;   pio run -e loader -t upload            the UART audio loader
;   pio run -e loader -t sendchant         push chant.raw into the flash
;   pio run -e leddemo -t upload           the LED demo
;
; The CH32V is not in the official PlatformIO registry. The community platform
; below is fetched from git on first build, which takes a few minutes once.

[platformio]
default_envs = player
src_dir = src

; ---------------------------------------------------------------------------

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = ch32v003fun

; TSSOP-20 part, 16 KB flash / 2 KB RAM. If PlatformIO says it does not know
; this board, `pio boards CH32V003` lists what the platform actually ships and
; the name is one of those.
board = genericCH32V003F4P6

; Upload protocol is deliberately NOT set here: the board default is normally
; right for a WCH-LinkE over SWIO, and a wrong value fails louder than a
; missing one. If `-t upload` cannot find the probe, `pio platform show
; Community-PIO-CH32V/platform-ch32v` lists the protocols this platform
; supports, and you set one here:
;
;   upload_protocol = minichlink

; -Isrc is required, not cosmetic. loader.c and led_wave_demo.c sit in
; subdirectories of src/ and include "board.h", which lives at the top of src/.
; A quote-include searches the including file's own directory first and then the
; include path - never the project's src root - so without this they miss it.
build_flags =
    -Isrc

; The loader's UART. The player's printf goes over SWIO instead (minichlink -T,
; or `make monitor`), not over a COM port - see the README.
monitor_speed = 115200

; Optional: build against the ch32v003fun checkout already in this repo rather
; than PlatformIO's own copy, so the Makefile and PlatformIO builds are byte-for
; byte the same framework. Needs the submodule present.
;
;   platform_packages = framework-ch32v003fun@symlink://./ch32v003fun

; ---------------------------------------------------------------------------
; PlatformIO compiles every source file under src_dir. This project has three
; programs with three main() functions in one tree, so each environment selects
; its own. `-<*>` first clears the default `+<*>`, then nothing is included that
; was not asked for - the failure mode otherwise is a duplicate-main link error
; that does not say which file it came from.
; ---------------------------------------------------------------------------

[env:player]
build_src_filter = -<*> +<main.c> +<audio.c> +<spiflash.c>

; Send printf out USART1 on PD5 at 115200 instead of over SWIO, so it can be
; read with `pio device monitor` on any USB-serial adapter - including the
; WCH-LinkE's own serial interface. Wiring: PD5 -> adapter RX, GND -> GND.
;
; ${env.build_flags} is not optional: a build_flags here REPLACES the [env]
; one rather than adding to it, and dropping -Isrc breaks every "board.h".
;
; This belongs to the player alone. The loader owns USART1 itself and must
; never get these flags - see the comment in src/funconfig.h.
build_flags =
    ${env.build_flags}
    -DFUNCONF_USE_UARTPRINTF=1
    -DFUNCONF_USE_DEBUGPRINTF=0

[env:loader]
build_src_filter = -<*> +<loader/loader.c> +<spiflash.c>
extra_scripts = post:scripts/pio_send_chant.py

; Where `pio run -e loader -t sendchant` looks for the audio and the port.
; The port is the USB-serial adapter wired to PD5/PD6 - NOT the debug probe's
; own interface. Leave custom_chant_port blank and set monitor_port instead if
; you would rather configure it in one place.
; chant8k.raw, not NaKomNamoCompressed.raw. The latter is a 44.1 kHz file, and
; send_chant.py stamps --rate into the header without ever looking at the audio
; — so it loaded fine and played 5.5x slow. tools/raw_resample.py converts it:
;
;   python tools/raw_resample.py NaKomNamoCompressed.raw chant8k.raw --in-rate 44100
;
; If you replace the chant, run it through that first and keep --rate here equal
; to its --out-rate. See docs/audio-pipeline.md.
custom_chant_file = chant8k-limit.raw
custom_chant_port = COM7
custom_chant_args = --rate 8000

[env:leddemo]
build_src_filter = -<*> +<demo/led_wave_demo.c>
